name: 🚀 CI/CD DevSecOps - Evaluation Service

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: evaluation-service
  GITOPS_REPO: igorcorrean/togglemaster-gitops
  IMAGE_TAG: v1.0.0-${{ github.sha }}-${{ github.run_number }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  # =========================================================================
  # JOB 1: Build, Test e Lint (Go)
  # =========================================================================
  build-and-test:
    name: 🧪 Build, Lint & Testes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 🔍 Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: 🧪 Executar Testes Unitários com Cobertura
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 📊 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: ignore

  # =========================================================================
  # JOB 2: Segurança (SAST & SCA) com Regra de Bloqueio Crítico
  # =========================================================================
  security-sast-sca:
    name: 🛡️ Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # SAST: Varredura de vulnerabilidades estáticas no código Go
      - name: 🔎 SAST (Gosec)
        uses: securego/gosec@master
        with:
          args: '-severity high -confidence high ./...'

      # SCA: Análise de vulnerabilidades em dependências do Go (go.mod / go.sum)
      - name: 📦 SCA - Scan de Dependências (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Bloqueia o pipeline se encontrar vulnerabilidade CRÍTICA

  # =========================================================================
  # JOB 3: Build da Imagem Docker, Container Scan & Push ECR
  # =========================================================================
  docker-build-push:
    name: 🐳 Docker Build, Scan & Push ECR
    runs-on: ubuntu-latest
    needs: security-sast-sca

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔑 Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔓 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1º Passo: Construir a imagem localmente com suporte à arquitetura linux/amd64
      - name: 🏗️ Docker Build Local
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      # 2º Passo: Scan da imagem Docker local antes do push
      - name: 🛡️ Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      # 3º Passo: Push para o ECR (apenas após aprovação do Trivy)
      - name: 🚀 Push da Imagem para o ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

